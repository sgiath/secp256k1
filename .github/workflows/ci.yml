name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every supported Elixir with every OTP it supports:
      # https://hexdocs.pm/elixir/compatibility-and-deprecations.html
      # ubuntu-24.04 is pinned because setup-beam provides OTP 24-25 only up to that
      # image; macOS (setup-beam: OTP 25+) covers the oldest and newest combos.
      # `full: false` rows build the NIF and run the full test suite instead of
      # `mix check`: dev-only tooling (ex_check, mix_audit's yaml_elixir,
      # mix_test_watch) requires Elixir 1.17 or 1.18.
      matrix:
        include:
          - { os: ubuntu-24.04, elixir: "1.16", otp: "24", full: false }
          - { os: ubuntu-24.04, elixir: "1.16", otp: "25", full: false }
          - { os: ubuntu-24.04, elixir: "1.16", otp: "26", full: false }
          - { os: ubuntu-24.04, elixir: "1.17", otp: "25", full: false }
          - { os: ubuntu-24.04, elixir: "1.17", otp: "26", full: false }
          - { os: ubuntu-24.04, elixir: "1.17", otp: "27", full: false }
          - { os: ubuntu-24.04, elixir: "1.18", otp: "25", full: true }
          - { os: ubuntu-24.04, elixir: "1.18", otp: "26", full: true }
          - { os: ubuntu-24.04, elixir: "1.18", otp: "27", full: true }
          - { os: ubuntu-24.04, elixir: "1.19", otp: "26", full: true }
          - { os: ubuntu-24.04, elixir: "1.19", otp: "27", full: true }
          - { os: ubuntu-24.04, elixir: "1.19", otp: "28", full: true }
          - { os: ubuntu-24.04, elixir: "1.20", otp: "27", full: true }
          - { os: ubuntu-24.04, elixir: "1.20", otp: "28", full: true }
          - { os: ubuntu-24.04, elixir: "1.20", otp: "29", full: true }
          - { os: macos-latest, elixir: "1.16", otp: "25", full: false }
          - { os: macos-latest, elixir: "1.20", otp: "29", full: true }
    env:
      SECP256K1_NIF_WERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same clang-format release as the devenv shell (nixpkgs clang-tools in
      # devenv.lock), so the git hook and CI agree on the output.
      - name: clang-format
        if: runner.os == 'Linux' && matrix.elixir == '1.20' && matrix.otp == '29'
        run: pipx run --spec clang-format==21.1.8 clang-format --dry-run --Werror c_src/*.c c_src/*.h

      - id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ matrix.full && 'full' || 'min' }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ matrix.full && 'full' || 'min' }}-

      - name: Install prettier
        if: matrix.full
        run: npm install --global prettier@3.8.3

      - name: Fetch dependencies
        if: matrix.full
        run: mix deps.get

      - name: Fetch test dependencies
        if: ${{ !matrix.full }}
        run: mix deps.get --only test
        env:
          MIX_ENV: test

      - name: mix check
        if: matrix.full
        run: mix check

      - name: mix test
        if: ${{ !matrix.full }}
        run: mix test --include expensive
        env:
          MIX_ENV: test

  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      CC: gcc
      SECP256K1_NIF_SANITIZE: "1"
      # Compiles in the native fault hooks; test_helper.exs then includes the
      # :fault_injection tests, so they run under ASan and UBSan.
      SECP256K1_NIF_FAULT_INJECTION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-sanitizers-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-sanitizers-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get --only test

      # The Makefile's build-configuration fingerprint (c_src/build/<id>/build-config)
      # includes SECP256K1_NIF_SANITIZE and SECP256K1_NIF_FAULT_INJECTION, so any
      # objects built without them are rebuilt.
      - name: Build sanitized NIF
        run: |
          mix compile
          ldd _build/test/lib/lib_secp256k1/priv/secp256k1_nif.so | grep -E 'lib(asan|ubsan)'

      # The BEAM itself is not instrumented, so the ASan runtime must be the first
      # loaded library. The build above runs without the preload; `mix test` finds
      # the NIF up to date and only loads it. `mix test --only` exits non-zero when
      # no test ran, so the second run fails if the fault-injection tests were
      # excluded or missing.
      - name: mix test (sanitized NIF)
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          export LD_PRELOAD
          mix test --include expensive
          mix test --only fault_injection
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  cross:
    name: cross-compile (aarch64-linux-gnu)
    runs-on: ubuntu-24.04
    # Mirrors a Nerves build: CROSSCOMPILE is the toolchain prefix without the
    # trailing dash (its basename becomes configure's --host) and CC is the cross
    # compiler. The host's ERTS headers stand in for the target's; both are LP64.
    env:
      MIX_ENV: prod
      CROSSCOMPILE: /usr/bin/aarch64-linux-gnu
      CC: aarch64-linux-gnu-gcc
      SECP256K1_NIF_WERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Install the aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Fetch dependencies
        run: mix deps.get --only prod

      - name: Cross-compile the NIF
        run: mix compile

      # The NIF must be an aarch64 ELF linked without the native-macOS flags and
      # carry the hardening baseline (RELRO, immediate binding, stack protector).
      - name: Check the cross-compiled NIF
        run: |
          nif=_build/prod/lib/lib_secp256k1/priv/secp256k1_nif.so
          file "$nif"
          file "$nif" | grep -q 'ELF 64-bit LSB shared object, ARM aarch64'
          if grep -F 'dynamic_lookup' c_src/build/*/build-config; then
            echo "::error::Darwin-only linker flags were used for a Linux target"
            exit 1
          fi
          readelf -lW "$nif" | grep -q GNU_RELRO
          readelf -dW "$nif" | grep -q BIND_NOW
          readelf --dyn-syms -W "$nif" | grep -q __stack_chk_fail

  package:
    name: package (hex.build --unpack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Build and unpack the Hex package
        run: mix hex.build --unpack --output "$RUNNER_TEMP/lib_secp256k1"

      # Compiles only the files listed in mix.exs `package: [files: ...]`, from a
      # pristine tree (no extracted c_src/secp256k1 or c_src/build/).
      - name: Compile the unpacked package as a path dependency
        working-directory: ${{ runner.temp }}
        run: |
          mix new consumer
          cd consumer
          cat > mix.exs <<EOF
          defmodule Consumer.MixProject do
            use Mix.Project

            def project do
              [app: :consumer, version: "0.1.0", deps: [{:lib_secp256k1, path: "$RUNNER_TEMP/lib_secp256k1"}]]
            end

            def application, do: [extra_applications: [:logger]]
          end
          EOF
          mix deps.get
          mix compile
          mix run -e '
            {seckey, pubkey} = Secp256k1.keypair(:xonly)
            signature = Secp256k1.schnorr_sign("hex package smoke", seckey)
            true = Secp256k1.schnorr_valid?(signature, "hex package smoke", pubkey)
            IO.puts("unpacked package NIF loaded and verified a signature")
          '
